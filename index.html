<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.M. Digital — Planificateur financier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1410; --card:#221b13; --card-border:#332a1e; --input-bg:#1a1410; --input-border:#3a2f22;
    --text:#F5EFE6; --text-dim:#D9CBB8; --text-muted:#A89684; --text-faint:#6b5d4d;
    --gold:#D4A44C; --gold-light:#E8C468; --green:#8fd0a0; --red:#e08a8a; --yellow:#e0c86a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  input::placeholder{color:#8a7a68;}
  input:focus,button:focus{outline:2px solid var(--gold);outline-offset:2px;}
  input[type=date]{color-scheme:dark;}
  .btn:hover{filter:brightness(1.08);cursor:pointer;}
  .row:hover .del{opacity:1;}
  .del{opacity:.55;transition:opacity .15s;}
  #app{max-width:720px;margin:0 auto;padding:24px 16px 48px;}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px;margin-bottom:16px;}
  .card-header{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .field-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
  input,.input{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;}
  .add-row{display:flex;gap:8px;margin-top:10px;}
  .btn-primary{background:var(--gold);border:none;border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:6px;color:#1a1410;font-weight:600;font-size:13px;white-space:nowrap;}
  .btn-icon{background:var(--gold);border:none;border-radius:10px;width:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .btn-muted{background:var(--card);border:1px solid var(--input-border);border-radius:8px;padding:6px 10px;color:var(--text-muted);font-size:11px;}
  .empty-hint{font-size:13px;color:var(--text-faint);font-style:italic;padding:8px 0;}
  .list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a2118;}
  .list-row-label{font-size:13px;color:var(--text-dim);flex:1;}
  .list-row-value{font-size:13px;font-weight:600;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;}
  .divider{height:1px;background:var(--card-border);margin:16px 0;}
  .progress-track{width:100%;height:10px;background:#3a2f22;border-radius:999px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#B5822E,#E8C468);border-radius:999px;transition:width .4s ease;}
  .progress-track-dark{width:100%;height:8px;background:var(--bg);border:1px solid var(--input-border);border-radius:999px;overflow:hidden;}
  .progress-fill-green{height:100%;background:linear-gradient(90deg,#4d8a5f,#8fd0a0);border-radius:999px;transition:width .4s ease;}
  .hero{background:linear-gradient(155deg,#2a2118 0%,#221b13 100%);border:1px solid var(--card-border);border-radius:18px;padding:28px 24px;margin-bottom:20px;}
  .hero-top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .hero-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold);}
  .hero-date-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);background:var(--bg);border:1px solid var(--input-border);border-radius:999px;padding:4px 10px;}
  .hero-title{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-bottom:14px;line-height:1.2;}
  .date-field-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;background:var(--bg);border:1px solid var(--input-border);border-radius:10px;padding:10px 12px;}
  .input-date-inline{background:transparent;border:none;color:var(--text);font-size:13px;width:auto;}
  .hero-stats-row{display:flex;align-items:center;gap:16px;}
  .hero-stat-value{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .hero-stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .hero-stat-divider{width:1px;height:28px;background:var(--input-border);}
  .grid-2{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
  .recommend-box{display:flex;gap:10px;background:var(--bg);border:1px solid var(--input-border);border-radius:12px;padding:14px;margin-top:16px;}
  .recommend-value{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--gold-light);}
  .recommend-sub{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.4;}
  .membre-card{background:var(--bg);border:1px solid var(--input-border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .membre-header{display:flex;justify-content:space-between;align-items:center;}
  .membre-nom-wrap{display:flex;align-items:center;gap:10px;}
  .membre-avatar{width:28px;height:28px;border-radius:50%;background:var(--input-border);color:var(--gold-light);font-family:'Fraunces',serif;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .membre-nom{font-size:14px;font-weight:600;}
  .membre-total{font-size:14px;font-weight:600;color:var(--gold-light);}
  .depot-row{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap;font-size:12px;}
  .depot-date{font-size:11px;color:var(--text-muted);min-width:42px;}
  .depot-frais{font-size:11px;color:var(--text-muted);flex:1;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .top-bar-client{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .top-bar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .logout-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--input-border);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--text-muted);font-size:12px;}
  .login-wrap{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:32px 24px;text-align:center;}
  .login-badge{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold);margin-bottom:10px;}
  .login-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:6px;line-height:1.25;}
  .login-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
  .input-login{width:100%;background:var(--bg);border:1px solid var(--input-border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;text-align:center;letter-spacing:.05em;}
  .login-error{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--red);font-size:12px;margin-top:10px;}
  .login-btn{width:100%;margin-top:16px;background:var(--gold);border:none;border-radius:10px;padding:12px 0;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#1a1410;font-weight:600;font-size:14px;}
  .login-hint{margin-top:18px;font-size:12px;color:var(--text-faint);line-height:1.5;}
  .status-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .client-dates-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:10px;flex-wrap:wrap;gap:6px;}
  .client-actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .error-banner{background:#3a2020;border:1px solid #5a3030;color:var(--red);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
  .config-warning{background:#3a3320;border:1px solid #5a5030;color:var(--yellow);padding:14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.5;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Chargement…</div></div>

<!-- Firebase (gratuit, sans carte bancaire) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   ÉTAPE OBLIGATOIRE : remplace cet objet par TA config Firebase.
   Va sur https://console.firebase.google.com → crée un projet
   (gratuit) → Paramètres du projet → "Ajouter une application Web"
   → copie l'objet firebaseConfig généré ici.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBO1M6gt5n00t3CjO3-GlKSaUc3PkOD91M",
  authDomain: "sm-digital-app.firebaseapp.com",
  projectId: "sm-digital-app",
  storageBucket: "sm-digital-app.firebasestorage.app",
  messagingSenderId: "805686228983",
  appId: "1:805686228983:web:cacaaf97fb24e1f0bb60f2",
  measurementId: "G-8Y219N3HHR"
};

const CONFIG_MISSING = firebaseConfig.apiKey === "REMPLACE_MOI";

const ADMIN_CODE = "ADMIN-2026";
const DUREE_ABONNEMENT_JOURS = 30;
const OWNER_CODE = "MARIO-OWNER";

let db = null;
if (!CONFIG_MISSING) {
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
}

/* ---------- Helpers ---------- */
function formatFCFA(n){ const v=Number(n)||0; return v.toLocaleString("fr-FR",{maximumFractionDigits:0})+" FCFA"; }
function monthsBetween(from,to){ if(!to) return 0; const a=new Date(from), b=new Date(to);
  return Math.max((b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()),0); }
function formatDateLongue(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}); }
function formatDateCourte(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}); }
function addDays(iso,days){ const d=new Date(iso); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function joursRestants(exp){ const now=new Date(); const e=new Date(exp); return Math.ceil((e-now)/86400000); }
function genererCode(nom){
  const init=(nom.trim().slice(0,3).toUpperCase().replace(/[^A-Z]/g,"")||"CLI");
  return `${init}-${Math.floor(1000+Math.random()*9000)}`;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

const emptyPlanner = ()=>({
  dateDebut:new Date().toISOString().slice(0,10),
  salaire:"", depenses:[], objectif:{nom:"",montant:"",dateLimite:""},
  cotisations:[], tontine:{nom:"",valeurMax:"",fraisRetraitPct:"",membres:[]}
});

/* ---------- Firestore access ---------- */
async function getRegistry(){
  const snap = await getDocs(collection(db,"clients"));
  const list=[]; snap.forEach(d=>list.push(d.data()));
  return list;
}
async function saveClient(client){ await setDoc(doc(db,"clients",client.id), client); }
async function deleteClientDoc(id){ await deleteDoc(doc(db,"clients",id)); }
async function getPlannerData(code){
  const snap = await getDoc(doc(db,"plannerData",code));
  if(snap.exists()) return { ...emptyPlanner(), ...snap.data() };
  return emptyPlanner();
}
async function savePlannerData(code,data){ await setDoc(doc(db,"plannerData",code), data); }

/* ---------- App state ---------- */
let state = { view:"login", codeInput:"", loginError:"", currentClient:null, registry:[], plannerData:null };
const app = document.getElementById("app");

function render(){
  if (CONFIG_MISSING){ app.innerHTML = renderConfigWarning(); return; }
  if (state.view==="login") app.innerHTML = renderLogin();
  else if (state.view==="admin") app.innerHTML = renderAdmin();
  else if (state.view==="app") app.innerHTML = renderClientApp();
  attachEvents();
}

function renderConfigWarning(){
  return `<div id="appWrap"><div class="config-warning">
    <strong>Configuration Firebase manquante.</strong><br/><br/>
    Ouvre le fichier <code>index.html</code>, cherche <code>firebaseConfig</code> en haut du script,
    et remplace les valeurs "REMPLACE_MOI" par celles de ton projet Firebase
    (console.firebase.google.com → Paramètres du projet → Ajouter une app Web).<br/><br/>
    C'est gratuit, sans carte bancaire, 5 minutes à configurer.
  </div></div>`;
}

/* ---------- LOGIN VIEW ---------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-badge">S.M. DIGITAL</div>
    <div class="login-title">Planificateur financier &amp; tontine</div>
    <div class="login-sub">Entre ton code d'accès pour continuer</div>
    <input id="codeInput" class="input-login" placeholder="Ex: ABC-1234" value="${esc(state.codeInput)}" />
    ${state.loginError ? `<div class="login-error">⚠️ ${esc(state.loginError)}</div>` : ""}
    <button id="loginBtn" class="login-btn btn">🔒 Accéder</button>
    <div class="login-hint">Pas encore de code ? Contacte S.M. Digital pour t'abonner (mobile money via Chariow).</div>
  </div>`;
}

/* ---------- ADMIN VIEW ---------- */
function renderAdmin(){
  const clients = state.registry.filter(c=>c.id!=="seed-owner");
  const dateAbonnement = state._adminDate || new Date().toISOString().slice(0,10);
  const dateExpPrevue = addDays(dateAbonnement, DUREE_ABONNEMENT_JOURS);
  return `
  <div class="top-bar">
    <span class="top-bar-client">🛡️ Panneau admin — S.M. Digital</span>
    <button id="logoutBtn" class="logout-btn">↩ Quitter</button>
  </div>

  <div class="card">
    <div class="card-header">➕ Ajouter un client abonné</div>
    <div class="grid-2">
      <div><label class="field-label">Nom du client</label><input id="admNom" class="input" placeholder="Ex: Fatou Diallo" value="${esc(state._admNom||"")}"/></div>
      <div><label class="field-label">Téléphone (mobile money)</label><input id="admTel" class="input" placeholder="Ex: 07 00 00 00 00" value="${esc(state._admTel||"")}"/></div>
    </div>
    <div style="margin-top:12px;"><label class="field-label">Date de l'abonnement (paiement)</label>
      <input id="admDate" class="input" type="date" value="${dateAbonnement}"/></div>
    <div class="recommend-box">
      <div>📅</div>
      <div>
        <div class="recommend-value">Expire le ${formatDateCourte(dateExpPrevue)}</div>
        <div class="recommend-sub">Calculé automatiquement : ${DUREE_ABONNEMENT_JOURS} jours à partir de la date de paiement.</div>
      </div>
    </div>
    <button id="admAddBtn" class="btn-primary btn" style="width:100%;justify-content:center;margin-top:16px;">➕ Créer le compte client</button>
  </div>

  <div class="card">
    <div class="card-header">👥 Clients (${clients.length})</div>
    ${clients.length===0 ? `<div class="empty-hint">Aucun client pour l'instant. Ajoute ton premier abonné ci-dessus.</div>` :
      clients.map(c=>{
        const jr = joursRestants(c.dateExpiration);
        const expire = jr<0, bientot = jr>=0 && jr<=5;
        const bg = !c.actif ? "#3a2020" : expire ? "#3a2020" : bientot ? "#3a3320" : "#20351f";
        const fg = !c.actif ? "#e0a0a0" : expire ? "#e0a0a0" : bientot ? "#e0c86a" : "#8fd0a0";
        const label = !c.actif ? "Désactivé" : expire ? "Expiré" : `${jr} j restants`;
        return `
        <div class="membre-card">
          <div class="membre-header">
            <div class="membre-nom-wrap">
              <div class="membre-avatar">${esc(c.nom.trim().charAt(0).toUpperCase())}</div>
              <div><div class="membre-nom">${esc(c.nom)}</div>
                <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${esc(c.code)}${c.telephone?` · ${esc(c.telephone)}`:""}</div>
              </div>
            </div>
            <span class="status-badge" style="background:${bg};color:${fg};">${label}</span>
          </div>
          <div class="client-dates-row">
            <span>Payé le ${formatDateCourte(c.dateAbonnement)}</span>
            <span>Expire le ${formatDateCourte(c.dateExpiration)}</span>
          </div>
          <div class="client-actions-row">
            <button class="btn-muted btn renewBtn" data-id="${c.id}" style="color:var(--gold);">🔄 Renouveler +${DUREE_ABONNEMENT_JOURS}j</button>
            <button class="btn-muted btn toggleBtn" data-id="${c.id}">${c.actif?"Désactiver":"Réactiver"}</button>
            <button class="btn-muted btn delBtn" data-id="${c.id}" style="color:var(--red);">🗑</button>
          </div>
        </div>`;
      }).join("")
    }
  </div>`;
}

/* ---------- CLIENT APP VIEW ---------- */
function renderClientApp(){
  const client = state.currentClient;
  const d = state.plannerData;
  const totalDepenses = d.depenses.reduce((s,x)=>s+(Number(x.montant)||0),0);
  const resteDisponible = (Number(d.salaire)||0) - totalDepenses;
  const totalCotise = d.cotisations.reduce((s,x)=>s+(Number(x.montant)||0),0);
  const objMontant = Number(d.objectif.montant)||0;
  const progression = objMontant>0 ? Math.min((totalCotise/objMontant)*100,100) : 0;
  const restant = Math.max(objMontant-totalCotise,0);
  const moisRestants = monthsBetween(new Date().toISOString(), d.objectif.dateLimite);
  const mensualite = moisRestants>0 ? restant/moisRestants : restant;
  const fraisPct = Number(d.tontine.fraisRetraitPct)||0;
  const valeurMaxT = Number(d.tontine.valeurMax)||0;
  const totalTontine = d.tontine.membres.reduce((s,m)=>s+m.depots.reduce((s2,x)=>s2+(Number(x.montant)||0),0),0);
  const progT = valeurMaxT>0 ? Math.min((totalTontine/valeurMaxT)*100,100) : 0;
  const jr = joursRestants(client.dateExpiration);

  return `
  <div class="top-bar">
    <span class="top-bar-client">Bonjour, ${esc(client.nom.split(" ")[0])}</span>
    <div class="top-bar-right">
      <span style="font-size:12px;color:${jr<=5?'var(--yellow)':'var(--green)'};">
        ${jr>=0 ? `Abonnement valide jusqu'au ${formatDateCourte(client.dateExpiration)}` : "Abonnement expiré"}
      </span>
      <button id="logoutBtn" class="logout-btn">↩ Se déconnecter</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-top-row">
      <div class="hero-label">PLANIFICATEUR FINANCIER</div>
      <div class="hero-date-badge">📅 Débuté le ${formatDateLongue(d.dateDebut)}</div>
    </div>
    <div class="hero-title">${d.objectif.nom ? esc(d.objectif.nom) : "Définis ton prochain objectif"}</div>
    <div class="date-field-row">
      <label class="field-label" style="margin:0;">Date de début de la planification</label>
      <input id="dateDebut" class="input-date-inline" type="date" value="${d.dateDebut}"/>
    </div>
    ${objMontant>0 ? `
    <div class="progress-track"><div class="progress-fill" style="width:${progression}%;"></div></div>
    <div class="hero-stats-row">
      <div><div class="hero-stat-value">${formatFCFA(totalCotise)}</div><div class="hero-stat-label">cotisé</div></div>
      <div class="hero-stat-divider"></div>
      <div><div class="hero-stat-value">${formatFCFA(restant)}</div><div class="hero-stat-label">restant</div></div>
      <div class="hero-stat-divider"></div>
      <div><div class="hero-stat-value">${progression.toFixed(0)}%</div><div class="hero-stat-label">atteint</div></div>
    </div>` : ""}
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-header">💰 Salaire &amp; dépenses</div>
      <label class="field-label">Salaire mensuel</label>
      <input id="salaire" class="input" type="number" placeholder="Ex: 150000" value="${esc(d.salaire)}"/>
      <label class="field-label" style="margin-top:18px;">Dépenses fixes</label>
      ${d.depenses.length===0?`<div class="empty-hint">Aucune dépense ajoutée pour l'instant.</div>`:
        d.depenses.map(x=>`<div class="row list-row"><span class="list-row-label">${esc(x.nom)}</span><span class="list-row-value">${formatFCFA(x.montant)}</span><button class="icon-btn del delDepense" data-id="${x.id}">🗑</button></div>`).join("")}
      <div class="add-row">
        <input id="newDepNom" class="input" style="flex:1.4;" placeholder="Nom (ex: Loyer)"/>
        <input id="newDepMontant" class="input" style="flex:1;" type="number" placeholder="Montant"/>
        <button id="addDepBtn" class="btn-icon btn">➕</button>
      </div>
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;color:var(--text-muted);">Reste disponible</span>
        <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${resteDisponible>=0?'var(--green)':'var(--red)'};">${formatFCFA(resteDisponible)}</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">🎯 Ton objectif</div>
      <label class="field-label">Nom de l'objectif</label>
      <input id="objNom" class="input" placeholder="Ex: Achat terrain, Studio..." value="${esc(d.objectif.nom)}"/>
      <label class="field-label" style="margin-top:14px;">Montant cible</label>
      <input id="objMontant" class="input" type="number" placeholder="Ex: 2000000" value="${esc(d.objectif.montant)}"/>
      <label class="field-label" style="margin-top:14px;">Date limite</label>
      <input id="objDate" class="input" type="date" value="${d.objectif.dateLimite}"/>
      ${objMontant>0 && d.objectif.dateLimite ? `
      <div class="recommend-box"><div>📈</div><div>
        <div class="recommend-value">${formatFCFA(mensualite)} / mois</div>
        <div class="recommend-sub">à cotiser sur ${moisRestants>0?moisRestants:"moins d'un"} mois pour atteindre ton objectif à temps</div>
      </div></div>` : ""}
    </div>
  </div>

  <div class="card">
    <div class="card-header">🐷 Suivi des cotisations</div>
    <div class="add-row">
      <input id="newCotMontant" class="input" style="flex:1;" type="number" placeholder="Montant versé aujourd'hui"/>
      <button id="addCotBtn" class="btn-primary btn">➕ Ajouter</button>
    </div>
    ${d.cotisations.length===0?`<div class="empty-hint">Aucun versement enregistré.</div>`:
      [...d.cotisations].reverse().map(c=>`
      <div class="row list-row"><span style="font-size:12px;">📅</span><span class="list-row-label">${formatDateCourte(c.date)}</span><span class="list-row-value">${formatFCFA(c.montant)}</span><button class="icon-btn del delCot" data-id="${c.id}">🗑</button></div>`).join("")}
  </div>

  <div class="card">
    <div class="card-header">👨‍👩‍👧‍👦 Tontine familiale</div>
    <div class="grid-2" style="grid-template-columns:1fr 1fr 1fr;">
      <div><label class="field-label">Nom de la tontine</label><input id="tontNom" class="input" placeholder="Ex: Tontine Sangaré" value="${esc(d.tontine.nom)}"/></div>
      <div><label class="field-label">Valeur maximale</label><input id="tontMax" class="input" type="number" placeholder="Ex: 1000000" value="${esc(d.tontine.valeurMax)}"/></div>
      <div><label class="field-label">Frais retrait (%)</label><input id="tontFrais" class="input" type="number" placeholder="Ex: 2" value="${esc(d.tontine.fraisRetraitPct)}"/></div>
    </div>
    ${valeurMaxT>0?`
    <div style="margin-top:18px;">
      <div class="progress-track-dark"><div class="progress-fill-green" style="width:${progT}%;"></div></div>
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;color:var(--text-muted);">
        <span>Somme totale collectée : <strong style="color:var(--text);">${formatFCFA(totalTontine)}</strong></span>
        <span>${progT.toFixed(0)}% de l'objectif</span>
      </div>
    </div>`:""}
    <div class="divider"></div>
    <label class="field-label">Ajouter un membre</label>
    <div class="add-row">
      <input id="newMembreNom" class="input" style="flex:1;" placeholder="Nom du membre"/>
      <button id="addMembreBtn" class="btn-primary btn">➕ Ajouter</button>
    </div>
    ${d.tontine.membres.length===0?`<div class="empty-hint">Aucun membre pour l'instant.</div>`:
      d.tontine.membres.map(m=>{
        const totalM = m.depots.reduce((s,x)=>s+(Number(x.montant)||0),0);
        return `<div class="membre-card">
          <div class="membre-header">
            <div class="membre-nom-wrap"><div class="membre-avatar">${esc(m.nom.trim().charAt(0).toUpperCase())}</div><span class="membre-nom">${esc(m.nom)}</span></div>
            <div style="display:flex;align-items:center;gap:10px;"><span class="membre-total">${formatFCFA(totalM)}</span><button class="icon-btn delMembre" data-id="${m.id}">🗑</button></div>
          </div>
          ${m.depots.length>0?`<div style="margin-top:10px;border-top:1px solid #2a2118;padding-top:6px;">
            ${[...m.depots].reverse().map(dp=>{
              const frais=(Number(dp.montant)||0)*(fraisPct/100), net=(Number(dp.montant)||0)-frais;
              return `<div class="row depot-row">💵 <span class="depot-date">${formatDateCourte(dp.date)}</span><span>${formatFCFA(dp.montant)}</span>${fraisPct>0?`<span class="depot-frais">frais ${formatFCFA(frais)} → net ${formatFCFA(net)}</span>`:""}<button class="icon-btn del delDepot" data-membre="${m.id}" data-depot="${dp.id}">🗑</button></div>`;
            }).join("")}
          </div>`:""}
          <div class="add-row">
            <input class="input depotInput" data-membre="${m.id}" type="number" placeholder="Montant du dépôt" style="flex:1;"/>
            <button class="btn-icon btn addDepotBtn" data-membre="${m.id}">➕</button>
          </div>
        </div>`;
      }).join("")}
  </div>`;
}

/* ---------- Events ---------- */
function attachEvents(){
  if (state.view==="login"){
    const ci=document.getElementById("codeInput");
    ci?.addEventListener("input",e=>state.codeInput=e.target.value);
    ci?.addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
    document.getElementById("loginBtn")?.addEventListener("click",doLogin);
  }
  if (state.view==="admin"){
    document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
    document.getElementById("admNom")?.addEventListener("input",e=>state._admNom=e.target.value);
    document.getElementById("admTel")?.addEventListener("input",e=>state._admTel=e.target.value);
    document.getElementById("admDate")?.addEventListener("input",e=>{state._adminDate=e.target.value; render();});
    document.getElementById("admAddBtn")?.addEventListener("click",addClient);
    document.querySelectorAll(".renewBtn").forEach(b=>b.addEventListener("click",()=>renewClient(b.dataset.id)));
    document.querySelectorAll(".toggleBtn").forEach(b=>b.addEventListener("click",()=>toggleClient(b.dataset.id)));
    document.querySelectorAll(".delBtn").forEach(b=>b.addEventListener("click",()=>deleteClient(b.dataset.id)));
  }
  if (state.view==="app"){
    document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
    bindDebounced("dateDebut", v=>state.plannerData.dateDebut=v);
    bindDebounced("salaire", v=>state.plannerData.salaire=v);
    bindDebounced("objNom", v=>state.plannerData.objectif.nom=v);
    bindDebounced("objMontant", v=>state.plannerData.objectif.montant=v);
    bindDebounced("objDate", v=>state.plannerData.objectif.dateLimite=v);
    bindDebounced("tontNom", v=>state.plannerData.tontine.nom=v);
    bindDebounced("tontMax", v=>state.plannerData.tontine.valeurMax=v);
    bindDebounced("tontFrais", v=>state.plannerData.tontine.fraisRetraitPct=v);

    document.getElementById("addDepBtn")?.addEventListener("click",addDepense);
    document.querySelectorAll(".delDepense").forEach(b=>b.addEventListener("click",()=>removeItem("depenses",b.dataset.id)));
    document.getElementById("addCotBtn")?.addEventListener("click",addCotisation);
    document.querySelectorAll(".delCot").forEach(b=>b.addEventListener("click",()=>removeItem("cotisations",b.dataset.id)));
    document.getElementById("addMembreBtn")?.addEventListener("click",addMembre);
    document.querySelectorAll(".delMembre").forEach(b=>b.addEventListener("click",()=>removeMembre(b.dataset.id)));
    document.querySelectorAll(".addDepotBtn").forEach(b=>b.addEventListener("click",()=>addDepot(b.dataset.membre)));
    document.querySelectorAll(".delDepot").forEach(b=>b.addEventListener("click",()=>removeDepot(b.dataset.membre,b.dataset.depot)));
  }
}
function bindDebounced(id,setter){
  const el=document.getElementById(id); if(!el) return;
  let t; el.addEventListener("input",e=>{ setter(e.target.value); clearTimeout(t); t=setTimeout(()=>persistPlanner(false),500); });
}

/* ---------- Actions ---------- */
async function doLogin(){
  state.loginError="";
  const code=(state.codeInput||"").trim().toUpperCase();
  if(!code) return;
  if(code===ADMIN_CODE){
    state.registry = await getRegistry();
    state.view="admin"; render(); return;
  }
  const registry = await getRegistry();
  state.registry = registry;
  let client = registry.find(c=>c.code.toUpperCase()===code);
  if(code===OWNER_CODE && !client){
    client = { id:"seed-owner", nom:"Mario (Propriétaire)", telephone:"", code:OWNER_CODE,
      dateAbonnement:new Date().toISOString().slice(0,10), dateExpiration:"2099-12-31", actif:true };
    await saveClient(client);
  }
  if(!client){ state.loginError="Code d'accès invalide. Vérifie et réessaie."; render(); return; }
  if(!client.actif){ state.loginError="Cet abonnement a été désactivé. Contacte S.M. Digital."; render(); return; }
  if(joursRestants(client.dateExpiration)<0){ state.loginError="Ton abonnement a expiré. Renouvelle-le pour continuer."; render(); return; }
  state.currentClient=client;
  state.plannerData = await getPlannerData(client.code);
  state.view="app"; render();
}
function doLogout(){ state={view:"login",codeInput:"",loginError:"",currentClient:null,registry:[],plannerData:null}; render(); }

async function addClient(){
  const nom=(state._admNom||"").trim(); if(!nom) return;
  const dateAbonnement = state._adminDate || new Date().toISOString().slice(0,10);
  const client={ id:uid(), nom, telephone:(state._admTel||"").trim(), code:genererCode(nom),
    dateAbonnement, dateExpiration: addDays(dateAbonnement,DUREE_ABONNEMENT_JOURS), actif:true };
  await saveClient(client);
  state._admNom=""; state._admTel=""; state._adminDate=new Date().toISOString().slice(0,10);
  state.registry = await getRegistry(); render();
}
async function renewClient(id){
  const c=state.registry.find(x=>x.id===id); if(!c) return;
  const base = joursRestants(c.dateExpiration)>0 ? c.dateExpiration : new Date().toISOString().slice(0,10);
  c.dateExpiration = addDays(base, DUREE_ABONNEMENT_JOURS); c.actif=true;
  await saveClient(c); state.registry = await getRegistry(); render();
}
async function toggleClient(id){
  const c=state.registry.find(x=>x.id===id); if(!c) return;
  c.actif=!c.actif; await saveClient(c); state.registry = await getRegistry(); render();
}
async function deleteClient(id){
  await deleteClientDoc(id); state.registry = await getRegistry(); render();
}

async function persistPlanner(rerender=true){
  await savePlannerData(state.currentClient.code, state.plannerData);
  if(rerender) render();
}
async function addDepense(){
  const nom=document.getElementById("newDepNom").value.trim();
  const montant=Number(document.getElementById("newDepMontant").value);
  if(!nom||!montant) return;
  state.plannerData.depenses.push({id:uid(),nom,montant});
  await persistPlanner();
}
async function addCotisation(){
  const montant=Number(document.getElementById("newCotMontant").value);
  if(!montant) return;
  state.plannerData.cotisations.push({id:uid(),montant,date:new Date().toISOString()});
  await persistPlanner();
}
async function removeItem(key,id){
  state.plannerData[key]=state.plannerData[key].filter(x=>x.id!==id);
  await persistPlanner();
}
async function addMembre(){
  const nom=document.getElementById("newMembreNom").value.trim(); if(!nom) return;
  state.plannerData.tontine.membres.push({id:uid(),nom,depots:[]});
  await persistPlanner();
}
async function removeMembre(id){
  state.plannerData.tontine.membres = state.plannerData.tontine.membres.filter(m=>m.id!==id);
  await persistPlanner();
}
async function addDepot(membreId){
  const input=document.querySelector(`.depotInput[data-membre="${membreId}"]`);
  const montant=Number(input.value); if(!montant) return;
  const m=state.plannerData.tontine.membres.find(x=>x.id===membreId);
  m.depots.push({id:uid(),montant,date:new Date().toISOString()});
  await persistPlanner();
}
async function removeDepot(membreId,depotId){
  const m=state.plannerData.tontine.membres.find(x=>x.id===membreId);
  m.depots=m.depots.filter(d=>d.id!==depotId);
  await persistPlanner();
}

render();
</script>
</body>
</html>
