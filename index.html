function t(key){ return (T[state.lang] && T[state.lang][key]) || (T.fr[key]) || key; }

/* ---------- Helpers ---------- */
function formatFCFA(n){ const v=Number(n)||0; return v.toLocaleString("fr-FR",{maximumFractionDigits:0})+" FCFA"; }
function monthsBetween(from,to){ if(!to) return 0; const a=new Date(from), b=new Date(to);
  return Math.max((b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()),0); }
function formatDateLongue(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString(state.lang==="en"?"en-GB":"fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}); }
function formatDateCourte(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString(state.lang==="en"?"en-GB":"fr-FR",{day:"2-digit",month:"short",year:"numeric"}); }
function addDays(iso,days){ const d=new Date(iso); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function joursRestants(exp){ const now=new Date(); const e=new Date(exp); return Math.ceil((e-now)/86400000); }
function genererCode(nom){
  const init=(nom.trim().slice(0,3).toUpperCase().replace(/[^A-Z]/g,"")||"CLI");
  return `${init}-${Math.floor(1000+Math.random()*9000)}`;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function monthKeyFromOffset(offset){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthLabel(key){
  const [y,m]=key.split("-").map(Number);
  const d=new Date(y,m-1,1);
  const s=d.toLocaleDateString(state.lang==="en"?"en-GB":"fr-FR",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

const emptyPlanner = ()=>({
  dateDebut:todayISO(),
  finance:{},                                   // { "2026-08": { salaire, depenses:[{id,nom,montant}] } }
  objectif:{nom:"",montant:"",dateLimite:""},
  cotisations:[],
  ventes:{},                                     // { "2026-08-27": { objets:[{id,nom,prix,qte}] } }
  tontine:{nom:"",valeurMax:"",fraisRetraitPct:"",membres:[]}
});
function emptyMoisFinance(){ return { salaire:"", depenses:[] }; }
function emptyJourVente(){ return { objets:[] }; }

function migratePlanner(data){
  // Compatibilité avec l'ancien format à plat (salaire/dépenses au premier niveau)
  const out = { ...emptyPlanner(), ...data };
  if(!out.finance) out.finance = {};
  if((data.salaire!==undefined || data.depenses!==undefined) && Object.keys(out.finance).length===0){
    const key = monthKeyFromOffset(0);
    out.finance[key] = { salaire: data.salaire||"", depenses: data.depenses||[] };
  }
  if(!out.ventes) out.ventes = {};
  delete out.salaire; delete out.depenses;
  return out;
}

/* ---------- Firestore access ---------- */
async function getRegistry(){
  const snap = await getDocs(collection(db,"clients"));
  const list=[]; snap.forEach(d=>list.push(d.data()));
  return list;
}
async function saveClient(client){ await setDoc(doc(db,"clients",client.id), client); }
async function deleteClientDoc(id){ await deleteDoc(doc(db,"clients",id)); }
async function getPlannerData(code){
  const snap = await getDoc(doc(db,"plannerData",code));
  if(snap.exists()) return migratePlanner(snap.data());
  return emptyPlanner();
}
async function savePlannerData(code,data){ await setDoc(doc(db,"plannerData",code), data); }

async function getRegistrations(){
  const snap = await getDocs(collection(db,"registrations"));
  const list=[]; snap.forEach(d=>list.push(d.data()));
  return list.sort((a,b)=> (a.date<b.date?1:-1));
}
async function saveRegistration(reg){ await setDoc(doc(db,"registrations",reg.id), reg); }
async function deleteRegistrationDoc(id){ await deleteDoc(doc(db,"registrations",id)); }

/* --- Page 3 : Objectif --- */
function renderTabObjectif(){
  const d = state.plannerData;
  const totalCotise = d.cotisations.reduce((s,x)=>s+(Number(x.montant)||0),0);
  const objMontant = Number(d.objectif.montant)||0;
  const progression = objMontant>0 ? Math.min((totalCotise/objMontant)*100,100) : 0;
  const restant = Math.max(objMontant-totalCotise,0);
  const moisRestants = monthsBetween(new Date().toISOString(), d.objectif.dateLimite);
  const mensualite = moisRestants>0 ? restant/moisRestants : restant;

  return `
  <div class="hero">
    <div class="hero-top-row">
      <div class="hero-label">${t("objectifHeader")}</div>
      <div class="hero-date-badge">📅 ${formatDateLongue(d.dateDebut)}</div>
    </div>
    <div class="hero-title">${d.objectif.nom ? esc(d.objectif.nom) : t("nomObjectif")}</div>
    ${objMontant>0 ? `
    <div class="progress-track"><div class="progress-fill" style="width:${progression}%;"></div></div>
    <div class="hero-stats-row">
      <div><div class="hero-stat-value">${formatFCFA(totalCotise)}</div><div class="hero-stat-label">${t("cotise")}</div></div>
      <div class="hero-stat-divider"></div>
      <div><div class="hero-stat-value">${formatFCFA(restant)}</div><div class="hero-stat-label">${t("restant")}</div></div>
      <div class="hero-stat-divider"></div>
      <div><div class="hero-stat-value">${progression.toFixed(0)}%</div><div class="hero-stat-label">${t("atteint")}</div></div>
    </div>` : ""}
  </div>

  <div class="card">
    <label class="field-label">${t("nomObjectif")}</label>
    <input id="objNom" class="input" placeholder="Ex: Achat terrain, Studio..." value="${esc(d.objectif.nom)}"/>
    <label class="field-label" style="margin-top:14px;">${t("montantCible")}</label>
    <input id="objMontant" class="input" type="number" placeholder="Ex: 2000000" value="${esc(d.objectif.montant)}"/>
    <label class="field-label" style="margin-top:14px;">${t("dateLimite")}</label>
    <input id="objDate" class="input" type="date" value="${d.objectif.dateLimite}"/>
    ${objMontant>0 && d.objectif.dateLimite ? `
    <div class="recommend-box"><div>📈</div><div>
      <div class="recommend-value">${formatFCFA(mensualite)} ${t("parMois")}</div>
      <div class="recommend-sub">${state.lang==="en"?`over ${moisRestants>0?moisRestants:"less than one"} `:`à cotiser sur ${moisRestants>0?moisRestants:"moins d'un"} `}${t("moisRestants")}</div>
    </div></div>` : ""}
  </div>

  <div class="card">
    <div class="card-header">${t("cotisationsHeader")}</div>
    <div class="add-row">
      <input id="newCotMontant" class="input" style="flex:1;" type="number" placeholder="${t("montantVerse")}"/>
      <button id="addCotBtn" class="btn-primary btn">${t("ajouter")}</button>
    </div>
    ${d.cotisations.length===0?`<div class="empty-hint">${t("aucunVersement")}</div>`:
      [...d.cotisations].reverse().map(c=>`
      <div class="row list-row"><span style="font-size:12px;">📅</span><span class="list-row-label">${formatDateCourte(c.date)}</span><span class="list-row-value">${formatFCFA(c.montant)}</span><button class="icon-btn del delCot" data-id="${c.id}">🗑</button></div>`).join("")}
  </div>`;
}

/* --- Page 5 : Tontine --- */
function renderTabTontine(){
  const d = state.plannerData;
  const fraisPct = Number(d.tontine.fraisRetraitPct)||0;
  const valeurMaxT = Number(d.tontine.valeurMax)||0;
  const totalTontine = d.tontine.membres.reduce((s,m)=>s+m.depots.reduce((s2,x)=>s2+(Number(x.montant)||0),0),0);
  const progT = valeurMaxT>0 ? Math.min((totalTontine/valeurMaxT)*100,100) : 0;

  return `
  <div class="card">
    <div class="card-header">${t("tontineHeader")}</div>
    <div class="grid-2" style="grid-template-columns:1fr 1fr 1fr;">
      <div><label class="field-label">${t("nomTontine")}</label><input id="tontNom" class="input" placeholder="Ex: Tontine Sangaré" value="${esc(d.tontine.nom)}"/></div>
      <div><label class="field-label">${t("valeurMax")}</label><input id="tontMax" class="input" type="number" placeholder="Ex: 1000000" value="${esc(d.tontine.valeurMax)}"/></div>
      <div><label class="field-label">${t("fraisRetrait")}</label><input id="tontFrais" class="input" type="number" placeholder="Ex: 2" value="${esc(d.tontine.fraisRetraitPct)}"/></div>
    </div>
    ${valeurMaxT>0?`
    <div style="margin-top:18px;">
      <div class="progress-track-dark"><div class="progress-fill-green" style="width:${progT}%;"></div></div>
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;color:var(--text-muted);">
        <span>${t("collecte")} : <strong style="color:var(--text);">${formatFCFA(totalTontine)}</strong></span>
        <span>${progT.toFixed(0)}%</span>
      </div>
    </div>`:""}
    <div class="divider"></div>
    <label class="field-label">${t("ajouterMembre")}</label>
    <div class="add-row">
      <input id="newMembreNom" class="input" style="flex:1;" placeholder="${t("nomMembre")}"/>
      <button id="addMembreBtn" class="btn-primary btn">${t("ajouter")}</button>
    </div>
    ${d.tontine.membres.length===0?`<div class="empty-hint">${t("aucunMembre")}</div>`:
      d.tontine.membres.map(m=>{
        const totalM = m.depots.reduce((s,x)=>s+(Number(x.montant)||0),0);
        return `<div class="membre-card">
          <div class="membre-header">
            <div class="membre-nom-wrap"><div class="membre-avatar">${esc(m.nom.trim().charAt(0).toUpperCase())}</div><span class="membre-nom">${esc(m.nom)}</span></div>
            <div style="display:flex;align-items:center;gap:10px;"><span class="membre-total">${formatFCFA(totalM)}</span><button class="icon-btn delMembre" data-id="${m.id}">🗑</button></div>
          </div>
          ${m.depots.length>0?`<div style="margin-top:10px;border-top:1px solid #2a2118;padding-top:6px;">
            ${[...m.depots].reverse().map(dp=>{
              const frais=(Number(dp.montant)||0)*(fraisPct/100), net=(Number(dp.montant)||0)-frais;
              return `<div class="row depot-row">💵 <span class="depot-date">${formatDateCourte(dp.date)}</span><span>${formatFCFA(dp.montant)}</span>${fraisPct>0?`<span class="depot-frais">frais ${formatFCFA(frais)} → net ${formatFCFA(net)}</span>`:""}<button class="icon-btn del delDepot" data-membre="${m.id}" data-depot="${dp.id}">🗑</button></div>`;
            }).join("")}
          </div>`:""}
          <div class="add-row">
            <input class="input depotInput" data-membre="${m.id}" type="number" placeholder="${t("montantDepot")}" style="flex:1;"/>
            <button class="btn-icon btn addDepotBtn" data-membre="${m.id}">➕</button>
          </div>
        </div>`;
      }).join("")}
  </div>`;
}

/* ---------- Events ---------- */
function attachEvents(){
  if (state.view==="home"){
    document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>{ state.lang=b.dataset.lang; render(); }));
    document.querySelectorAll(".home-mode-btn").forEach(b=>b.addEventListener("click",()=>{ state.homeMode=b.dataset.mode; state.loginError=""; render(); }));

    const ci=document.getElementById("codeInput");
    ci?.addEventListener("input",e=>state.codeInput=e.target.value);
    ci?.addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
    document.getElementById("loginBtn")?.addEventListener("click",doLogin);

    document.getElementById("sgNom")?.addEventListener("input",e=>state._sgNom=e.target.value);
    document.getElementById("sgEmail")?.addEventListener("input",e=>state._sgEmail=e.target.value);
    document.getElementById("sgWhatsapp")?.addEventListener("input",e=>state._sgWhatsapp=e.target.value);
    document.getElementById("signupBtn")?.addEventListener("click",doSignup);
    document.getElementById("signupAgainBtn")?.addEventListener("click",()=>{ state.signupSuccess=false; state._sgNom=""; state._sgEmail=""; state._sgWhatsapp=""; render(); });
  }
  if (state.view==="admin"){
    document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
    document.getElementById("admNom")?.addEventListener("input",e=>state._admNom=e.target.value);
    document.getElementById("admTel")?.addEventListener("input",e=>state._admTel=e.target.value);
    document.getElementById("admDate")?.addEventListener("input",e=>{state._adminDate=e.target.value; render();});
    document.getElementById("admAddBtn")?.addEventListener("click",addClient);
    document.querySelectorAll(".renewBtn").forEach(b=>b.addEventListener("click",()=>renewClient(b.dataset.id)));
    document.querySelectorAll(".toggleBtn").forEach(b=>b.addEventListener("click",()=>toggleClient(b.dataset.id)));
    document.querySelectorAll(".delBtn").forEach(b=>b.addEventListener("click",()=>deleteClient(b.dataset.id)));
    document.querySelectorAll(".validateRegBtn").forEach(b=>b.addEventListener("click",()=>validateRegistration(b.dataset.id)));
    document.querySelectorAll(".rejectRegBtn").forEach(b=>b.addEventListener("click",()=>rejectRegistration(b.dataset.id)));
  }
  if (state.view==="app"){
    document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
    document.querySelectorAll(".tabBtn").forEach(b=>b.addEventListener("click",()=>{ state.tab=b.dataset.tab; render(); }));

    if(state.tab==="salaire"){
      bindDebounced("salaire", v=>{ const key=monthKeyFromOffset(state.financeMonthOffset); if(!state.plannerData.finance[key]) state.plannerData.finance[key]=emptyMoisFinance(); state.plannerData.finance[key].salaire=v; });
      document.getElementById("monthPrevBtn")?.addEventListener("click",()=>{ state.financeMonthOffset--; render(); });
      document.getElementById("monthNextBtn")?.addEventListener("click",()=>{ if(state.financeMonthOffset<0){ state.financeMonthOffset++; render(); } });
      document.getElementById("addDepBtn")?.addEventListener("click",addDepense);
      document.querySelectorAll(".delDepense").forEach(b=>b.addEventListener("click",()=>removeDepense(b.dataset.id)));
    }
    if(state.tab==="objectif"){
      bindDebounced("objNom", v=>state.plannerData.objectif.nom=v);
      bindDebounced("objMontant", v=>state.plannerData.objectif.montant=v);
      bindDebounced("objDate", v=>state.plannerData.objectif.dateLimite=v);
      document.getElementById("addCotBtn")?.addEventListener("click",addCotisation);
      document.querySelectorAll(".delCot").forEach(b=>b.addEventListener("click",()=>removeItem("cotisations",b.dataset.id)));
    }
    if(state.tab==="ventes"){
      document.getElementById("venteDateInput")?.addEventListener("change",e=>{ state.venteDate=e.target.value; render(); });
      document.getElementById("addArtBtn")?.addEventListener("click",addArticleVente);
      document.querySelectorAll(".delArticle").forEach(b=>b.addEventListener("click",()=>removeArticleVente(b.dataset.id)));
      document.getElementById("saveVenteBtn")?.addEventListener("click",()=>persistPlanner());
      document.querySelectorAll(".loadVenteDate").forEach(b=>b.addEventListener("click",()=>{ state.venteDate=b.dataset.date; render(); }));
    }
    if(state.tab==="tontine"){
      bindDebounced("tontNom", v=>state.plannerData.tontine.nom=v);
      bindDebounced("tontMax", v=>state.plannerData.tontine.valeurMax=v);
      bindDebounced("tontFrais", v=>state.plannerData.tontine.fraisRetraitPct=v);
      document.getElementById("addMembreBtn")?.addEventListener("click",addMembre);
      document.querySelectorAll(".delMembre").forEach(b=>b.addEventListener("click",()=>removeMembre(b.dataset.id)));
      document.querySelectorAll(".addDepotBtn").forEach(b=>b.addEventListener("click",()=>addDepot(b.dataset.membre)));
      document.querySelectorAll(".delDepot").forEach(b=>b.addEventListener("click",()=>removeDepot(b.dataset.membre,b.dataset.depot)));
    }
  }
}
function bindDebounced(id,setter){
  const el=document.getElementById(id); if(!el) return;
  let t; el.addEventListener("input",e=>{ setter(e.target.value); clearTimeout(t); t=setTimeout(()=>persistPlanner(false),500); });
}

/* ---------- Actions : accueil ---------- */
async function doLogin(){
  state.loginError="";
  const code=(state.codeInput||"").trim().toUpperCase();
  if(!code) return;
  if(code===ADMIN_CODE){
    state.registry = await getRegistry();
    state.registrations = await getRegistrations();
    state.view="admin"; render(); return;
  }
  const registry = await getRegistry();
  state.registry = registry;
  let client = registry.find(c=>c.code.toUpperCase()===code);
  if(code===OWNER_CODE && !client){
    client = { id:"seed-owner", nom:"Mario (Propriétaire)", telephone:"", code:OWNER_CODE,
      dateAbonnement:todayISO(), dateExpiration:"2099-12-31", actif:true };
    await saveClient(client);
  }
  if(!client){ state.loginError = state.lang==="en" ? "Invalid access code. Check and try again." : "Code d'accès invalide. Vérifie et réessaie."; render(); return; }
  if(!client.actif){ state.loginError = state.lang==="en" ? "This subscription has been disabled. Contact S.M. Digital." : "Cet abonnement a été désactivé. Contacte S.M. Digital."; render(); return; }
  if(joursRestants(client.dateExpiration)<0){ state.loginError = state.lang==="en" ? "Your subscription has expired. Renew it to continue." : "Ton abonnement a expiré. Renouvelle-le pour continuer."; render(); return; }
  state.currentClient=client;
  state.plannerData = await getPlannerData(client.code);
  state.tab="salaire"; state.financeMonthOffset=0; state.venteDate=todayISO();
  state.view="app"; render();
}
function doLogout(){
  state={ lang:state.lang, view:"home", homeMode:"login", codeInput:"", loginError:"",
    currentClient:null, registry:[], plannerData:null, signupSuccess:false,
    _sgNom:"", _sgEmail:"", _sgWhatsapp:"", registrations:[],
    tab:"salaire", financeMonthOffset:0, venteDate:todayISO() };
  render();
}

async function doSignup(){
  state.loginError="";
  const nom=(state._sgNom||"").trim();
  const email=(state._sgEmail||"").trim();
  const whatsapp=(state._sgWhatsapp||"").trim();
  if(!nom || !email || !whatsapp){
    state.loginError = state.lang==="en" ? "Please fill in all fields." : "Merci de remplir tous les champs.";
    render(); return;
  }
  const reg = { id:uid(), nom, email, whatsapp, langue:state.lang, date:todayISO(), statut:"attente" };
  await saveRegistration(reg);
  state.signupSuccess=true; render();
}

/* ---------- Actions : admin ---------- */
async function addClient(){
  const nom=(state._admNom||"").trim(); if(!nom) return;
  const dateAbonnement = state._adminDate || todayISO();
  const client={ id:uid(), nom, telephone:(state._admTel||"").trim(), code:genererCode(nom),
    dateAbonnement, dateExpiration: addDays(dateAbonnement,DUREE_ABONNEMENT_JOURS), actif:true };
  await saveClient(client);
  state._admNom=""; state._admTel=""; state._adminDate=todayISO();
  state.registry = await getRegistry(); render();
}
async function renewClient(id){
  const c=state.registry.find(x=>x.id===id); if(!c) return;
  const base = joursRestants(c.dateExpiration)>0 ? c.dateExpiration : todayISO();
  c.dateExpiration = addDays(base, DUREE_ABONNEMENT_JOURS); c.actif=true;
  await saveClient(c); state.registry = await getRegistry(); render();
}
async function toggleClient(id){
  const c=state.registry.find(x=>x.id===id); if(!c) return;
  c.actif=!c.actif; await saveClient(c); state.registry = await getRegistry(); render();
}
async function deleteClient(id){
  await deleteClientDoc(id); state.registry = await getRegistry(); render();
}
async function validateRegistration(id){
  const reg = state.registrations.find(r=>r.id===id); if(!reg) return;
  const dateAbonnement = todayISO();
  const client={ id:uid(), nom:reg.nom, telephone:reg.whatsapp, email:reg.email, code:genererCode(reg.nom),
    dateAbonnement, dateExpiration: addDays(dateAbonnement,DUREE_ABONNEMENT_JOURS), actif:true };
  await saveClient(client);
  await deleteRegistrationDoc(id);
  state.registry = await getRegistry();
  state.registrations = await getRegistrations();
  render();
}
async function rejectRegistration(id){
  await deleteRegistrationDoc(id);
  state.registrations = await getRegistrations();
  render();
}

/* ---------- Actions : espace client ---------- */
async function persistPlanner(rerender=true){
  await savePlannerData(state.currentClient.code, state.plannerData);
  if(rerender) render();
}
async function addDepense(){
  const nom=document.getElementById("newDepNom").value.trim();
  const montant=Number(document.getElementById("newDepMontant").value);
  if(!nom||!montant) return;
  const key=monthKeyFromOffset(state.financeMonthOffset);
  if(!state.plannerData.finance[key]) state.plannerData.finance[key]=emptyMoisFinance();
  state.plannerData.finance[key].depenses.push({id:uid(),nom,montant});
  await persistPlanner();
}
async function removeDepense(id){
  const key=monthKeyFromOffset(state.financeMonthOffset);
  if(!state.plannerData.finance[key]) return;
  state.plannerData.finance[key].depenses = state.plannerData.finance[key].depenses.filter(x=>x.id!==id);
  await persistPlanner();
}
async function addCotisation(){
  const montant=Number(document.getElementById("newCotMontant").value);
  if(!montant) return;
  state.plannerData.cotisations.push({id:uid(),montant,date:new Date().toISOString()});
  await persistPlanner();
}
async function removeItem(key,id){
  state.plannerData[key]=state.plannerData[key].filter(x=>x.id!==id);
  await persistPlanner();
}
async function addArticleVente(){
  const nom=document.getElementById("newArtNom").value.trim();
  const prix=Number(document.getElementById("newArtPrix").value);
  const qte=Number(document.getElementById("newArtQte").value)||1;
  if(!nom||!prix) return;
  const date=state.venteDate;
  if(!state.plannerData.ventes[date]) state.plannerData.ventes[date]=emptyJourVente();
  state.plannerData.ventes[date].objets.push({id:uid(),nom,prix,qte});
  await persistPlanner();
}
async function removeArticleVente(id){
  const date=state.venteDate;
  if(!state.plannerData.ventes[date]) return;
  state.plannerData.ventes[date].objets = state.plannerData.ventes[date].objets.filter(x=>x.id!==id);
  await persistPlanner();
}
async function addMembre(){
  const nom=document.getElementById("newMembreNom").value.trim(); if(!nom) return;
  state.plannerData.tontine.membres.push({id:uid(),nom,depots:[]});
  await persistPlanner();
}
async function removeMembre(id){
  state.plannerData.tontine.membres = state.plannerData.tontine.membres.filter(m=>m.id!==id);
  await persistPlanner();
}
async function addDepot(membreId){
  const input=document.querySelector(`.depotInput[data-membre="${membreId}"]`);
  const montant=Number(input.value); if(!montant) return;
  const m=state.plannerData.tontine.membres.find(x=>x.id===membreId);
  m.depots.push({id:uid(),montant,date:new Date().toISOString()});
  await persistPlanner();
}
async function removeDepot(membreId,depotId){
  const m=state.plannerData.tontine.membres.find(x=>x.id===membreId);
  m.depots=m.depots.filter(d=>d.id!==depotId);
  await persistPlanner();
}

render();
</script>
